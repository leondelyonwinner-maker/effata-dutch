<div class="pron-widget" data-target-text="{{ target_text }}" data-csrf="{{ csrf_token }}">
  <button type="button" class="pron-mic-btn" data-pron-mic>
    <span class="pron-mic-icon" aria-hidden="true">&#127908;</span>
    <span class="pron-mic-label">Ucapkan kata ini</span>
  </button>
  <p class="pron-unsupported" hidden>Browser ini tidak mendukung speech recognition. Coba buka di Chrome desktop/Android.</p>
  <div class="pron-result"></div>
</div>
